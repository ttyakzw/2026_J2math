<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ブリッジイット</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', system-ui, sans-serif;
  background: #1a1f2e;
  color: #e8eaf0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 1.2rem 1rem 2rem;
}

/* ヘッダー */
header {
  width: 100%;
  max-width: 820px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
}
.logo { font-size: 20px; font-weight: 700; letter-spacing: .04em; color: #fff; }
.logo span { color: #e05a3a; }

/* ターン表示バー */
#turn-bar {
  width: 100%;
  max-width: 820px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: #242a3d;
  border-radius: 10px;
  padding: 10px 16px;
  margin-bottom: 1rem;
  border: 1px solid #2e3550;
}
.turn-pip { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; transition: background .25s; }
.turn-pip.red  { background: #e05a3a; box-shadow: 0 0 8px #e05a3a88; }
.turn-pip.blue { background: #fff; border: 2.5px solid #3a8de0; box-shadow: 0 0 8px #3a8de088; }
#turn-text { font-size: 14px; font-weight: 500; flex: 1; }
#turn-count { font-size: 12px; color: #7a8099; margin-left: auto; }

/* メインレイアウト */
#main {
  width: 100%;
  max-width: 820px;
  display: flex;
  gap: 1rem;
  align-items: flex-start;
  flex-wrap: wrap;
  justify-content: center;
}

canvas {
  display: block;
  border-radius: 12px;
  border: 1px solid #2e3550;
  background: #0f1219;
  cursor: pointer;
  flex-shrink: 0;
}

/* サイドパネル */
#side {
  flex: 1 1 170px;
  min-width: 160px;
  max-width: 200px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.panel {
  background: #242a3d;
  border: 1px solid #2e3550;
  border-radius: 10px;
  padding: 12px 14px;
}

.panel-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: #5a6280;
  margin-bottom: 8px;
}

/* スコア */
.score-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: #8a90a8;
  margin-bottom: 6px;
}
.score-row:last-child { margin-bottom: 0; }
.score-val { font-weight: 700; font-size: 18px; color: #e8eaf0; }
.score-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.score-dot.r { background: #e05a3a; }
.score-dot.b { background: #3a8de0; }

/* 凡例 */
.legend-item {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: #8a90a8;
  margin-bottom: 5px;
  line-height: 1.5;
}
.legend-item:last-child { margin-bottom: 0; }
.leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.leg-dot.r  { background: #e05a3a; }
.leg-dot.b  { background: #0f1219; border: 2px solid #3a8de0; }
.leg-dot.bg { background: #3a8de0; }

/* ボタン */
btn-group { display: flex; flex-direction: column; gap: 6px; }
button {
  font-family: inherit;
  font-size: 13px;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid #3a405a;
  background: #1a1f2e;
  color: #c8cad8;
  cursor: pointer;
  width: 100%;
  transition: background .15s, border-color .15s;
  margin-bottom: 6px;
}
button:last-child { margin-bottom: 0; }
button:hover { background: #2e3550; border-color: #4a5070; }
button:active { transform: scale(.98); }

/* 勝利バナー */
#win-banner {
  display: none;
  background: linear-gradient(135deg, #1e3a1e, #243a24);
  border: 1px solid #3a6a3a;
  border-radius: 10px;
  padding: 12px 14px;
  text-align: center;
}
#win-banner .win-text { font-size: 16px; font-weight: 700; color: #7cda7c; }
#win-banner .win-sub  { font-size: 11px; color: #5a8a5a; margin-top: 4px; }

/* 記録欄 */
#record-area {
  width: 100%;
  max-width: 820px;
  margin-top: .8rem;
  background: #242a3d;
  border: 1px solid #2e3550;
  border-radius: 10px;
  padding: 12px 16px;
}
#record-area h3 { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: #5a6280; text-transform: uppercase; margin-bottom: 8px; }
#record-table { width: 100%; border-collapse: collapse; font-size: 13px; }
#record-table th { color: #5a6280; font-weight: 500; text-align: left; padding: 3px 8px; font-size: 11px; border-bottom: 1px solid #2e3550; }
#record-table td { padding: 4px 8px; color: #a0a8c0; border-bottom: 1px solid #232840; }
#record-table tr:last-child td { border-bottom: none; }
.rec-win-red  { color: #e05a3a; font-weight: 700; }
.rec-win-blue { color: #3a8de0; font-weight: 700; }
#clear-rec { font-size: 11px; padding: 4px 10px; width: auto; margin-top: 8px; }

/* 考察メモ */
#memo-area {
  width: 100%;
  max-width: 820px;
  margin-top: .6rem;
}
#memo-area label { font-size: 12px; color: #5a6280; display: block; margin-bottom: 4px; }
#memo-area textarea {
  width: 100%;
  background: #242a3d;
  border: 1px solid #2e3550;
  border-radius: 8px;
  color: #c8cad8;
  font-family: inherit;
  font-size: 13px;
  padding: 10px 12px;
  resize: vertical;
  min-height: 70px;
  outline: none;
}
#memo-area textarea:focus { border-color: #4a5070; }
</style>
</head>
<body>

<header>
  <div class="logo">Bridge<span>-it</span></div>
  <div style="font-size:12px;color:#5a6280;">先手：赤　後手：青</div>
</header>

<!-- ターン表示 -->
<div id="turn-bar">
  <div class="turn-pip red" id="turn-pip"></div>
  <span id="turn-text">赤の番　― 赤点どうしの間をクリック（縦・横どちらも可）</span>
  <span id="turn-count">手数：0</span>
</div>

<!-- ゲーム本体 -->
<div id="main">
  <canvas id="board-canvas"></canvas>
  <div id="side">

    <div class="panel" id="win-banner">
      <div class="win-text" id="win-text"></div>
      <div class="win-sub"  id="win-sub"></div>
    </div>

    <div class="panel">
      <div class="panel-label">スコア</div>
      <div class="score-row">
        <span><span class="score-dot r"></span>赤の橋</span>
        <span class="score-val" id="s-red">0</span>
      </div>
      <div class="score-row">
        <span><span class="score-dot b"></span>青の橋</span>
        <span class="score-val" id="s-blue">0</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-label">凡例</div>
      <div class="legend-item"><div class="leg-dot r"></div>赤点●（縦横可・上下ゴール）</div>
      <div class="legend-item"><div class="leg-dot b"></div>青点○（縦横可）</div>
      <div class="legend-item"><div class="leg-dot bg"></div>青のゴール点（塗り）</div>
    </div>

    <div class="panel" style="padding:10px 14px;">
      <button id="undo-btn">↩ 一手戻す</button>
      <button id="reset-btn">↺ リセット</button>
      <button id="save-btn">📝 結果を記録</button>
    </div>

    <div class="panel" style="font-size:11px;color:#5a6280;line-height:1.7;">
      <div class="panel-label">ルール</div>
      ●赤は縦・横どちらにも橋を架け<br>
      　<strong style="color:#e05a3a">上下のゴール</strong>をつなぐと勝ち<br>
      ○青は縦・横どちらにも橋を架け<br>
      　<strong style="color:#3a8de0">左右のゴール</strong>をつなぐと勝ち<br><br>
      赤と青の橋は<strong>交差できない</strong>
    </div>
  </div>
</div>

<!-- 対戦記録 -->
<div id="record-area">
  <h3>対戦記録</h3>
  <table id="record-table">
    <thead><tr><th>#</th><th>勝者</th><th>手数</th><th>メモ</th></tr></thead>
    <tbody id="record-body">
      <tr><td colspan="4" style="color:#3a405a;font-size:12px;">まだ記録がありません</td></tr>
    </tbody>
  </table>
  <button id="clear-rec">記録をクリア</button>
</div>

<!-- 考察メモ -->
<div id="memo-area">
  <label>📝 気づいたこと・作戦メモ（自由に書こう）</label>
  <textarea id="memo" placeholder="例：相手のゴール付近に先回りすると強い　／　先手が有利かも？"></textarea>
</div>

<script>
// ======================================================
// ブリッジイット ゲームエンジン（生徒版）
// ======================================================
const N = 6;
const CSIZE = 540;
const RSIZE = 460;
const PAD = 58;
const YPAD = 36;
const S = (RSIZE - YPAD * 2 - 40) / ((N - 1) * 2);

const canvas = document.getElementById('board-canvas');
canvas.width  = CSIZE;
canvas.height = RSIZE;
const ctx = canvas.getContext('2d');

function rPos(ri, ci) { return { x: PAD + ci*2*S, y: YPAD + ri*2*S }; }
function bPos(ri, ci) { return { x: PAD + (2*ci-1)*S, y: YPAD + (2*ri+1)*S }; }
function isBlueGoal(ci) { return ci === 0 || ci === N; }

const RV = (ri,ci)=>`RV:${ri},${ci}`;
const RH = (ri,ci)=>`RH:${ri},${ci}`;
const BV = (ri,ci)=>`BV:${ri},${ci}`;
const BH = (ri,ci)=>`BH:${ri},${ci}`;

let turn='red', bridges={}, moveHistory=[], gameOver=false, hoverEdge=null, moveCount=0;

function rvBlocked(ri,ci){ return !!bridges[BH(ri,ci)]; }
function rhBlocked(ri,ci){ return ri>=1 && !!bridges[BV(ri-1,ci)]; }
function bhBlocked(ri,ci){ return !!bridges[RV(ri,ci)]; }
function bvBlocked(ri,ci){ return ri+1<=N-1 && !!bridges[RH(ri+1,ci)]; }

// ---- 描画 ----
function draw() {
  ctx.clearRect(0,0,CSIZE,RSIZE);
  ctx.fillStyle='#0f1219'; ctx.fillRect(0,0,CSIZE,RSIZE);
  drawGoalZones(); drawBridges(); drawHoverEdge(); drawDots(); drawGoalLabels();
}

function drawGoalZones() {
  const tl=rPos(0,0),tr=rPos(0,N-1),bl=rPos(N-1,0);
  const w=tr.x-tl.x;
  ctx.fillStyle='rgba(224,90,58,0.10)';
  ctx.fillRect(tl.x-8,tl.y-20,w+16,20);
  ctx.fillRect(bl.x-8,bl.y,w+16,20);
  const bTL=bPos(0,0),bBL=bPos(N-2,0),bTR=bPos(0,N),bBR=bPos(N-2,N);
  const hL=bBL.y-bTL.y, hR=bBR.y-bTR.y;
  ctx.fillStyle='rgba(58,141,224,0.10)';
  ctx.fillRect(bTL.x-14,bTL.y-8,14,hL+16);
  ctx.fillRect(bTR.x,bTR.y-8,14,hR+16);
}

function drawGoalLabels() {
  ctx.font='10px system-ui,sans-serif'; ctx.textAlign='center';
  const tl=rPos(0,0),tr=rPos(0,N-1),bl=rPos(N-1,0);
  ctx.fillStyle='#e05a3a';
  ctx.fillText('● 赤ゴール',(tl.x+tr.x)/2,tl.y-8);
  ctx.fillText('● 赤ゴール',(tl.x+tr.x)/2,bl.y+26);
  const bTL=bPos(0,0),bBL=bPos(N-2,0),bTR=bPos(0,N),bBR=bPos(N-2,N);
  const mL=(bTL.y+bBL.y)/2, mR=(bTR.y+bBR.y)/2;
  ctx.fillStyle='#3a8de0';
  ctx.save();ctx.translate(bTL.x-10,mL);ctx.rotate(-Math.PI/2);ctx.fillText('○ 青ゴール',0,0);ctx.restore();
  ctx.save();ctx.translate(bTR.x+10,mR);ctx.rotate(Math.PI/2);ctx.fillText('○ 青ゴール',0,0);ctx.restore();
}

function drawBridges() {
  for(const key in bridges){
    const color=bridges[key];
    const [type,coords]=key.split(':');
    const [ri,ci]=coords.split(',').map(Number);
    let p1,p2;
    if(type==='RV'){p1=rPos(ri,ci);p2=rPos(ri+1,ci);}
    else if(type==='RH'){p1=rPos(ri,ci);p2=rPos(ri,ci+1);}
    else if(type==='BV'){p1=bPos(ri,ci);p2=bPos(ri+1,ci);}
    else{p1=bPos(ri,ci);p2=bPos(ri,ci+1);}
    ctx.strokeStyle=color==='red'?'#e05a3a':'#3a8de0';
    ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
  }
}

function drawHoverEdge() {
  if(!hoverEdge||gameOver)return;
  const{p1,p2}=hoverEdge;
  ctx.strokeStyle=turn==='red'?'rgba(224,90,58,0.45)':'rgba(58,141,224,0.45)';
  ctx.lineWidth=6;ctx.lineCap='round';ctx.setLineDash([5,4]);
  ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
  ctx.setLineDash([]);
}

function drawDots() {
  for(let ri=0;ri<N;ri++)for(let ci=0;ci<N;ci++){
    const p=rPos(ri,ci);
    ctx.fillStyle='#e05a3a';
    ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.fill();
  }
  for(let ri=0;ri<N-1;ri++)for(let ci=0;ci<=N;ci++){
    const p=bPos(ri,ci);
    if(isBlueGoal(ci)){
      ctx.fillStyle='#3a8de0';
      ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.fill();
    } else {
      ctx.fillStyle='#0f1219';ctx.strokeStyle='#3a8de0';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(p.x,p.y,5.5,0,Math.PI*2);ctx.fill();ctx.stroke();
    }
  }
}

// ---- 入力 ----
function nearMid(mx,my,p1,p2,thr){
  const cx=(p1.x+p2.x)/2,cy=(p1.y+p2.y)/2;
  return Math.hypot(mx-cx,my-cy)<thr;
}

function getEdgeAt(mx,my){
  const thr=S*0.55;
  if(turn==='red'){
    for(let ri=0;ri<N-1;ri++)for(let ci=0;ci<N;ci++){
      const key=RV(ri,ci);if(bridges[key]||rvBlocked(ri,ci))continue;
      const p1=rPos(ri,ci),p2=rPos(ri+1,ci);if(nearMid(mx,my,p1,p2,thr))return{key,p1,p2};
    }
    for(let ri=0;ri<N;ri++)for(let ci=0;ci<N-1;ci++){
      const key=RH(ri,ci);if(bridges[key]||rhBlocked(ri,ci))continue;
      const p1=rPos(ri,ci),p2=rPos(ri,ci+1);if(nearMid(mx,my,p1,p2,thr))return{key,p1,p2};
    }
  } else {
    for(let ri=0;ri<N-2;ri++)for(let ci=0;ci<=N;ci++){
      const key=BV(ri,ci);if(bridges[key]||bvBlocked(ri,ci))continue;
      const p1=bPos(ri,ci),p2=bPos(ri+1,ci);if(nearMid(mx,my,p1,p2,thr))return{key,p1,p2};
    }
    for(let ri=0;ri<N-1;ri++)for(let ci=0;ci<N;ci++){
      const key=BH(ri,ci);if(bridges[key]||bhBlocked(ri,ci))continue;
      const p1=bPos(ri,ci),p2=bPos(ri,ci+1);if(nearMid(mx,my,p1,p2,thr))return{key,p1,p2};
    }
  }
  return null;
}

canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  const sx=CSIZE/rect.width,sy=RSIZE/rect.height;
  hoverEdge=getEdgeAt((e.clientX-rect.left)*sx,(e.clientY-rect.top)*sy);
  canvas.style.cursor=hoverEdge?'pointer':'default';draw();
});
canvas.addEventListener('mouseleave',()=>{hoverEdge=null;draw();});
canvas.addEventListener('click',e=>{
  if(gameOver)return;
  const rect=canvas.getBoundingClientRect();
  const sx=CSIZE/rect.width,sy=RSIZE/rect.height;
  const edge=getEdgeAt((e.clientX-rect.left)*sx,(e.clientY-rect.top)*sy);
  if(!edge)return;
  bridges[edge.key]=turn;
  moveHistory.push({key:edge.key,color:turn});
  hoverEdge=null; moveCount++;
  updateScores();
  if(checkWin(turn)){gameOver=true;showWin(turn);draw();return;}
  turn=turn==='red'?'blue':'red';
  updateTurnUI();draw();
});

function updateTurnUI(){
  const pip=document.getElementById('turn-pip');
  pip.className='turn-pip '+turn;
  document.getElementById('turn-text').textContent=turn==='red'
    ?'赤の番　― 赤点どうしの間をクリック（縦・横どちらも可）'
    :'青の番　― 青点どうしの間をクリック（縦・横どちらも可）';
  document.getElementById('turn-count').textContent='手数：'+moveCount;
}

function updateScores(){
  let r=0,b=0;for(const k in bridges){if(bridges[k]==='red')r++;else b++;}
  document.getElementById('s-red').textContent=r;
  document.getElementById('s-blue').textContent=b;
  document.getElementById('turn-count').textContent='手数：'+moveCount;
}

// ---- 勝利判定 ----
function checkWin(player){
  if(player==='red'){
    const visited=new Set(),queue=[];
    for(let ci=0;ci<N;ci++){const k=`0,${ci}`;visited.add(k);queue.push([0,ci]);}
    while(queue.length){
      const[ri,ci]=queue.shift();if(ri===N-1)return true;
      pR(queue,visited,ri+1,ci,bridges[RV(ri,ci)]==='red');
      pR(queue,visited,ri-1,ci,ri>0&&bridges[RV(ri-1,ci)]==='red');
      pR(queue,visited,ri,ci+1,ci<N-1&&bridges[RH(ri,ci)]==='red');
      pR(queue,visited,ri,ci-1,ci>0&&bridges[RH(ri,ci-1)]==='red');
    }return false;
  } else {
    const visited=new Set(),queue=[];
    for(let ri=0;ri<N-1;ri++){const k=`${ri},0`;visited.add(k);queue.push([ri,0]);}
    while(queue.length){
      const[ri,ci]=queue.shift();if(ci===N)return true;
      pB(queue,visited,ri,ci+1,ci<N&&bridges[BH(ri,ci)]==='blue');
      pB(queue,visited,ri,ci-1,ci>0&&bridges[BH(ri,ci-1)]==='blue');
      pB(queue,visited,ri+1,ci,ri<N-2&&bridges[BV(ri,ci)]==='blue');
      pB(queue,visited,ri-1,ci,ri>0&&bridges[BV(ri-1,ci)]==='blue');
    }return false;
  }
}
function pR(q,v,ri,ci,c){if(!c||ri<0||ri>=N||ci<0||ci>=N)return;const k=`${ri},${ci}`;if(!v.has(k)){v.add(k);q.push([ri,ci]);}}
function pB(q,v,ri,ci,c){if(!c||ri<0||ri>=N-1||ci<0||ci>N)return;const k=`${ri},${ci}`;if(!v.has(k)){v.add(k);q.push([ri,ci]);}}

function showWin(player){
  const banner=document.getElementById('win-banner');
  banner.style.display='';
  document.getElementById('win-text').textContent=player==='red'?'🔴 赤の勝ち！':'🔵 青の勝ち！';
  document.getElementById('win-sub').textContent=player==='red'?'上下ゴールを完成！':'左右ゴールを完成！';
  document.getElementById('turn-text').textContent='ゲーム終了！記録して再戦しよう。';
}

// ---- 記録機能 ----
let records=[];
document.getElementById('save-btn').addEventListener('click',()=>{
  if(!gameOver){alert('ゲームが終わっていません！');return;}
  const winner=document.getElementById('win-text').textContent;
  const memo=document.getElementById('memo').value;
  records.push({n:records.length+1, winner, moves:moveCount, memo});
  renderRecords();
  resetGame();
});

function renderRecords(){
  const tbody=document.getElementById('record-body');
  if(records.length===0){tbody.innerHTML='<tr><td colspan="4" style="color:#3a405a;font-size:12px;">まだ記録がありません</td></tr>';return;}
  tbody.innerHTML=records.map(r=>{
    const cls=r.winner.includes('赤')?'rec-win-red':'rec-win-blue';
    const m=r.memo?r.memo.slice(0,20)+(r.memo.length>20?'…':''):'-';
    return `<tr><td>${r.n}</td><td class="${cls}">${r.winner}</td><td>${r.moves}</td><td title="${r.memo}">${m}</td></tr>`;
  }).join('');
}

document.getElementById('clear-rec').addEventListener('click',()=>{
  if(confirm('記録をすべて消しますか？')){records=[];renderRecords();}
});

function resetGame(){
  bridges={};moveHistory=[];turn='red';gameOver=false;hoverEdge=null;moveCount=0;
  document.getElementById('win-banner').style.display='none';
  document.getElementById('memo').value='';
  updateScores();updateTurnUI();draw();
}

document.getElementById('reset-btn').addEventListener('click',resetGame);
document.getElementById('undo-btn').addEventListener('click',()=>{
  if(!moveHistory.length||gameOver)return;
  const last=moveHistory.pop();delete bridges[last.key];
  turn=last.color;gameOver=false;hoverEdge=null;moveCount=Math.max(0,moveCount-1);
  document.getElementById('win-banner').style.display='none';
  updateScores();updateTurnUI();draw();
});

draw();
</script>
