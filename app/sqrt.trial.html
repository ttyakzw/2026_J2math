<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平方根タイムトライアル | 中学数学</title>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<style>
:root {
  --bg:#f0f4ff; --surface:#ffffff; --surface2:#eef1fb; --border:#d0d8f0;
  --text:#1a1e3a; --text-muted:#6b72a0;
  --accent:#3a5bff; --accent2:#8b5cf6; --accent3:#06b6d4;
  --correct:#16a34a; --wrong:#dc2626; --warning:#d97706;
  --timer-ok:#3a5bff; --timer-warn:#d97706; --timer-danger:#dc2626;
  --bonus:#0891b2;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'M PLUS Rounded 1c',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 12px 40px;
  background-image:radial-gradient(ellipse at 10% 0%,rgba(58,91,255,0.08) 0%,transparent 55%),
    radial-gradient(ellipse at 90% 100%,rgba(139,92,246,0.07) 0%,transparent 55%);}
.katex{color:var(--text);}
.katex-display{color:var(--text);margin:0;}
#questionExpr .katex-display>.katex{font-size:2.6em;}
.explanation .katex{color:#0d6e3f;font-size:1.05em;}
.feedback .katex{color:inherit;font-size:.88em;}
.answer-label-math .katex{font-size:1.25em;}
#questionHint .katex{font-size:1em;color:var(--text-muted);}

header{width:100%;max-width:720px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.logo{font-family:'Kaisei Decol',serif;font-size:19px;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.score-bar{display:flex;gap:12px;align-items:center;}
.score-item{font-size:11px;color:var(--text-muted);}
.score-item span{font-size:14px;font-weight:800;color:var(--text);margin-left:3px;}
.streak-badge{display:none;background:linear-gradient(135deg,#f59e0b,#ef4444);
  color:#fff;font-size:12px;font-weight:800;border-radius:20px;padding:3px 10px;}
.streak-badge.visible{display:inline-block;}

.level-tabs{display:flex;gap:6px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:50px;padding:4px;margin-bottom:12px;box-shadow:0 2px 8px rgba(58,91,255,.07);}
.tab-btn{padding:7px 18px;border:none;border-radius:46px;font-family:'M PLUS Rounded 1c',sans-serif;
  font-size:13px;font-weight:700;cursor:pointer;background:transparent;color:var(--text-muted);transition:all .2s;}
.tab-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;
  box-shadow:0 2px 10px rgba(58,91,255,.25);}

.timer-row{width:100%;max-width:720px;display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.timer-display{font-size:28px;font-weight:800;min-width:54px;text-align:center;
  font-variant-numeric:tabular-nums;color:var(--timer-ok);transition:color .4s;}
.timer-display.warn{color:var(--timer-warn);}
.timer-display.danger{color:var(--timer-danger);animation:shake .3s ease infinite alternate;}
@keyframes shake{from{transform:translateX(-2px);}to{transform:translateX(2px);}}
.timer-track{flex:1;height:10px;background:var(--surface2);border-radius:5px;overflow:hidden;border:1.5px solid var(--border);}
.timer-fill{height:100%;border-radius:5px;background:var(--timer-ok);transition:width .25s linear,background .4s;}
.timer-fill.warn{background:var(--timer-warn);}
.timer-fill.danger{background:var(--timer-danger);}

.bonus-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
  background:linear-gradient(135deg,#0891b2,#6366f1);color:white;
  font-size:20px;font-weight:800;padding:14px 32px;border-radius:50px;
  box-shadow:0 8px 32px rgba(8,145,178,.4);z-index:999;pointer-events:none;
  transition:transform .25s cubic-bezier(.175,.885,.32,1.275),opacity .3s;}
.bonus-toast.show{transform:translate(-50%,-50%) scale(1);}
.bonus-toast.hide{transform:translate(-50%,-50%) scale(0);opacity:0;}

.card{width:100%;max-width:720px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:20px;padding:22px 24px 20px;margin-bottom:14px;box-shadow:0 4px 24px rgba(58,91,255,.08);}
.progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.level-badge{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  padding:3px 10px;border-radius:20px;background:rgba(58,91,255,.1);color:var(--accent);
  border:1px solid rgba(58,91,255,.25);}
.progress-label{font-size:12px;color:var(--text-muted);}
.progress-track{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;
  margin-bottom:20px;border:1px solid var(--border);}
.progress-fill{height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s ease;}

.question-area{text-align:center;margin-bottom:20px;min-height:96px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
.question-hint{display:none;}
#questionExpr{min-height:68px;display:flex;align-items:center;justify-content:center;}
.qtype-badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 9px;
  border-radius:10px;margin-bottom:2px;background:rgba(6,182,212,.12);color:var(--accent3);
  border:1px solid rgba(6,182,212,.3);}
.diff-badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;margin-left:5px;}
.diff-1{background:rgba(22,163,74,.12);color:var(--correct);}
.diff-2{background:rgba(217,119,6,.12);color:var(--warning);}
.diff-3{background:rgba(220,38,38,.12);color:var(--wrong);}

.answer-area{display:flex;flex-direction:column;gap:12px;align-items:center;}
.answer-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;}
.input-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
.answer-input{width:72px;height:52px;background:var(--surface2);border:2px solid var(--border);
  border-radius:12px;color:var(--text);font-family:'M PLUS Rounded 1c',sans-serif;
  font-size:22px;font-weight:800;text-align:center;outline:none;
  transition:border-color .18s,background .18s;-moz-appearance:textfield;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.06);cursor:pointer;user-select:none;}
.answer-input.wide{width:90px;}
.answer-input::-webkit-outer-spin-button,.answer-input::-webkit-inner-spin-button{-webkit-appearance:none;}
.answer-input.focused{border-color:var(--accent);background:#f5f7ff;box-shadow:0 0 0 3px rgba(58,91,255,.18);}
.answer-input.correct{border-color:var(--correct);background:#f0fdf4;}
.answer-input.wrong{border-color:var(--wrong);background:#fef2f2;}
.input-label{font-size:11px;color:var(--text-muted);text-align:center;}
.answer-label-math{display:flex;align-items:center;}
.times-sign{font-size:20px;color:var(--text-muted);padding-bottom:16px;}
.eq-sign{font-size:20px;color:var(--text-muted);padding-bottom:16px;}

.check-btn{padding:12px 40px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;border-radius:50px;color:white;font-family:'M PLUS Rounded 1c',sans-serif;
  font-size:15px;font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .15s;
  box-shadow:0 4px 14px rgba(58,91,255,.3);margin-top:6px;}
.check-btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(58,91,255,.35);}
.check-btn:active{transform:scale(.97);}
.next-btn{display:none;padding:10px 30px;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:50px;color:var(--text);font-family:'M PLUS Rounded 1c',sans-serif;
  font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;transition:background .18s,transform .15s;}
.next-btn:hover{background:var(--border);transform:translateY(-1px);}
.next-btn.visible{display:inline-block;}

.hint-btn{padding:7px 20px;background:#fff7ed;border:1.5px solid #fed7aa;border-radius:20px;
  color:#c2410c;font-family:'M PLUS Rounded 1c',sans-serif;font-size:12px;font-weight:700;
  cursor:pointer;transition:background .18s;margin-top:4px;}
.hint-btn:hover{background:#ffedd5;}
.hint-btn:disabled{opacity:.4;cursor:not-allowed;}
.hint-popup{display:none;background:#fffbeb;border:1.5px solid #fde68a;border-radius:12px;
  padding:10px 14px;font-size:13px;color:#92400e;margin-top:8px;text-align:left;line-height:1.7;}
.hint-popup.visible{display:block;}
.hint-popup .katex{color:#92400e;}

.feedback{text-align:center;font-size:17px;font-weight:800;min-height:24px;}
.feedback.correct{color:var(--correct);}
.feedback.wrong{color:var(--wrong);}
@keyframes pop{0%{transform:scale(.5);opacity:0;}70%{transform:scale(1.15);}100%{transform:scale(1);opacity:1;}}
.celebrate{animation:pop .38s cubic-bezier(.175,.885,.32,1.275) forwards;}

.explanation{display:none;background:#f0fdf4;border-left:3px solid var(--correct);
  border-radius:0 12px 12px 0;padding:12px 16px;font-size:13px;color:#166534;
  line-height:1.9;margin-top:16px;text-align:left;}
.explanation.visible{display:block;}
.explanation strong{color:#14532d;}
.expl-steps{margin-top:8px;}
.expl-step{display:flex;align-items:flex-start;gap:8px;padding:4px 0;
  border-top:1px dashed #bbf7d0;margin-top:4px;}
.expl-step:first-child{border-top:none;margin-top:0;}
.step-num{background:#16a34a;color:white;font-size:10px;font-weight:800;
  width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:1px;}
.step-body{flex:1;font-size:12px;}
.step-body .katex{font-size:1em;}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:720px;}
.stat-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;
  padding:12px 6px;text-align:center;box-shadow:0 2px 8px rgba(58,91,255,.05);}
.stat-val{font-size:22px;font-weight:800;}
.stat-val.c{color:var(--correct);}
.stat-val.w{color:var(--wrong);}
.stat-val.a{color:var(--accent);}
.stat-val.t{color:var(--accent2);}
.stat-name{font-size:10px;color:var(--text-muted);margin-top:2px;}

/* ── 名前入力（毎回表示） ── */
.name-screen{text-align:center;padding:8px 0 4px;}
.name-screen h2{font-size:18px;font-weight:800;margin-bottom:8px;}
.name-screen p{font-size:12px;color:var(--text-muted);margin-bottom:14px;}
.name-input{width:100%;max-width:260px;padding:11px 16px;font-size:18px;font-weight:700;
  border:2px solid var(--border);border-radius:14px;background:var(--surface2);color:var(--text);
  outline:none;text-align:center;font-family:'M PLUS Rounded 1c',sans-serif;
  margin-bottom:14px;display:block;margin-left:auto;margin-right:auto;}
.name-input:focus{border-color:var(--accent);}

.start-screen{text-align:center;padding:8px 0 4px;}
.start-screen h2{font-size:19px;font-weight:800;margin-bottom:7px;color:var(--text);}
.start-screen p{font-size:12px;color:var(--text-muted);margin-bottom:14px;line-height:1.7;}
.start-btn{padding:14px 48px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;border-radius:50px;color:white;font-family:'M PLUS Rounded 1c',sans-serif;
  font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(58,91,255,.3);
  transition:transform .15s,box-shadow .15s;}
.start-btn:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(58,91,255,.35);}
.start-btn:active{transform:scale(.97);}

@keyframes flash-red{0%,100%{background:var(--surface);}50%{background:#fee2e2;}}
.card.timeout-flash{animation:flash-red .35s ease 2;}

.finish-rank{font-size:48px;font-weight:800;line-height:1;}
.rank-S{color:#d97706;text-shadow:0 0 18px rgba(217,119,6,.4);}
.rank-A{color:var(--accent);}
.rank-B{color:var(--correct);}
.rank-C{color:var(--text-muted);}

.numpad-wrap{width:100%;max-width:340px;margin:14px auto 0;}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.nk{height:56px;border:1.5px solid var(--border);border-radius:14px;background:var(--surface);
  color:var(--text);font-family:'M PLUS Rounded 1c',sans-serif;font-size:22px;font-weight:800;
  cursor:pointer;transition:background .12s,transform .1s,box-shadow .1s;
  box-shadow:0 2px 6px rgba(0,0,0,.06);-webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center;}
.nk:active,.nk.pressed{background:var(--surface2);transform:scale(.93);box-shadow:none;}
.nk.nk-zero{grid-column:span 2;}
.nk.nk-bs{background:#fff0f0;color:var(--wrong);border-color:#fca5a5;}
.nk.nk-bs:active{background:#fee2e2;}
.nk.nk-enter{grid-column:span 3;background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;border:none;box-shadow:0 4px 12px rgba(58,91,255,.25);font-size:15px;}
.nk.nk-enter:active{transform:scale(.96);box-shadow:none;}

.log-screen{padding:4px 0;}
.log-tabs{display:flex;gap:6px;margin-bottom:12px;}
.log-tab-btn{flex:1;padding:7px 4px;border:1.5px solid var(--border);border-radius:10px;
  background:var(--surface2);color:var(--text-muted);font-family:'M PLUS Rounded 1c',sans-serif;
  font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;}
.log-tab-btn.active{background:var(--accent);color:white;border-color:var(--accent);}
.chart-wrap{position:relative;width:100%;}
canvas.log-chart{width:100%!important;border-radius:12px;}
.log-table-wrap{max-height:260px;overflow-y:auto;border-radius:12px;border:1.5px solid var(--border);}
.log-table{width:100%;border-collapse:collapse;font-size:12px;}
.log-table th{background:var(--surface2);color:var(--text-muted);padding:7px 8px;text-align:center;
  position:sticky;top:0;font-weight:700;border-bottom:1.5px solid var(--border);}
.log-table td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--border);color:var(--text);}
.log-table tr:last-child td{border-bottom:none;}
.log-table tr:nth-child(even) td{background:var(--surface2);}
.rank-cell{font-weight:800;}
.rank-cell.S{color:#d97706;}.rank-cell.A{color:var(--accent);}
.rank-cell.B{color:var(--correct);}.rank-cell.C{color:var(--text-muted);}
.no-log{text-align:center;padding:28px 0;color:var(--text-muted);font-size:13px;}
.nav-btn{padding:7px 18px;border:1.5px solid var(--border);border-radius:20px;
  background:var(--surface2);color:var(--text);font-family:'M PLUS Rounded 1c',sans-serif;
  font-size:13px;font-weight:700;cursor:pointer;transition:background .18s;}
.nav-btn:hover{background:var(--border);}
.clear-btn{padding:5px 12px;border:1.5px solid #fca5a5;border-radius:16px;background:#fff0f0;
  color:var(--wrong);font-family:'M PLUS Rounded 1c',sans-serif;font-size:11px;font-weight:700;cursor:pointer;}
.log-open-btn{padding:5px 12px;border:1.5px solid var(--border);border-radius:20px;
  background:var(--surface);color:var(--text-muted);font-family:'M PLUS Rounded 1c',sans-serif;
  font-size:11px;font-weight:700;cursor:pointer;transition:all .18s;}
.log-open-btn:hover{background:var(--surface2);color:var(--accent);border-color:var(--accent);}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.summary-card{background:var(--surface2);border:1.5px solid var(--border);
  border-radius:12px;padding:9px 6px;text-align:center;}
.summary-val{font-size:19px;font-weight:800;color:var(--accent);}
.summary-name{font-size:10px;color:var(--text-muted);margin-top:2px;}

.weakness-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;}
.wk-card{background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;
  padding:8px 10px;display:flex;flex-direction:column;gap:3px;}
.wk-label{font-size:10px;color:var(--text-muted);font-weight:700;}
.wk-bar-wrap{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.wk-bar{height:100%;border-radius:3px;transition:width .5s ease;}
.wk-bar.good{background:var(--correct);}
.wk-bar.mid{background:var(--warning);}
.wk-bar.bad{background:var(--wrong);}
.wk-rate{font-size:11px;font-weight:800;}

.qtype-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 18px;}
.qtype-item{background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;
  padding:10px 10px 8px;text-align:center;}
.qtype-item strong{color:var(--accent);display:block;margin-bottom:6px;font-size:10px;
  font-weight:800;letter-spacing:.5px;text-transform:uppercase;text-align:left;}
.qtype-item .ex-expr{min-height:38px;display:flex;align-items:center;justify-content:center;}
.qtype-item .ex-expr .katex-display>.katex{font-size:1.4em;}
.qtype-item .ex-expr .katex{font-size:1.2em;color:var(--text);}
.qtype-item .ex-ans{font-size:10px;color:var(--text-muted);margin-top:4px;}
.qtype-item .ex-ans .katex{font-size:1em;color:var(--accent2);}
.qtype-item.diff-basic{border-color:rgba(22,163,74,.3);background:rgba(22,163,74,.05);}
.qtype-item.diff-basic strong{color:var(--correct);}
.qtype-item.diff-mid{border-color:rgba(217,119,6,.3);background:rgba(217,119,6,.05);}
.qtype-item.diff-mid strong{color:var(--warning);}
.qtype-item.diff-hard{border-color:rgba(139,92,246,.3);background:rgba(139,92,246,.05);}
.qtype-item.diff-hard strong{color:var(--accent2);}

.mastery-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.mastery-badge{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700;border:1.5px solid;}
.mastery-badge.gold{background:#fef3c7;color:#92400e;border-color:#fcd34d;}
.mastery-badge.silver{background:#f1f5f9;color:#475569;border-color:#cbd5e1;}
.mastery-badge.none{background:var(--surface2);color:var(--text-muted);border-color:var(--border);}

.missed-toggle{width:100%;padding:13px 18px;background:linear-gradient(135deg,#fef2f2,#fff0f0);
  border:1.5px solid #fca5a5;border-radius:14px;color:var(--wrong);
  font-family:'M PLUS Rounded 1c',sans-serif;font-size:14px;font-weight:800;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;transition:background .18s;
  -webkit-tap-highlight-color:transparent;}
.missed-toggle:hover{background:linear-gradient(135deg,#fee2e2,#fecaca);}
.toggle-arrow{font-size:12px;transition:transform .2s;}
.missed-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:16px;margin-top:10px;}
.missed-badge{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.missed-num{font-size:11px;font-weight:800;color:var(--wrong);}
.missed-qtype{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;background:rgba(6,182,212,.12);color:var(--accent3);}
.missed-diff{font-size:10px;font-weight:800;padding:2px 8px;border-radius:8px;margin-left:2px;}
.missed-expr{text-align:center;padding:10px 0 6px;min-height:54px;display:flex;align-items:center;justify-content:center;}
.missed-expr .katex-display>.katex{font-size:2em;}
.missed-hint{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:7px 12px;font-size:12px;color:#92400e;margin:6px 0;}
.missed-answer{font-size:13px;font-weight:700;color:var(--correct);padding:6px 12px;background:#f0fdf4;border-radius:8px;border:1px solid #bbf7d0;margin:6px 0;text-align:center;}
.missed-answer .katex{color:var(--correct);}
.missed-steps{margin-top:8px;}
.missed-steps-title{font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;}

.review-panel{width:100%;max-width:720px;margin-top:14px;}
.review-toggle{width:100%;padding:13px 18px;background:linear-gradient(135deg,#eff6ff,#e0e7ff);
  border:1.5px solid #93c5fd;border-radius:14px;color:#1d4ed8;
  font-family:'M PLUS Rounded 1c',sans-serif;font-size:14px;font-weight:800;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;transition:background .18s;
  -webkit-tap-highlight-color:transparent;}
.review-toggle:hover{background:linear-gradient(135deg,#dbeafe,#c7d2fe);}
.review-body{display:none;background:var(--surface);border:1.5px solid #bfdbfe;

<script>

/* ══════════════════════════════════════════════════════
   ★ 教員設定 ★
   ══════════════════════════════════════════════════════ */
const GAS_URL = 'https://script.google.com/macros/s/AKfycby0yZre9hLJwbcOWgXM0SCuPxCNAK0yP_rtUcgmRIeH54Gefpwmi6rO570m-62DgWAQ/exec';
const CLASS_LIST = ['A','B','C','D'];

/* ── KaTeX ── */
function kt(tex,el,display){katex.render(tex,el,{throwOnError:false,displayMode:!!display});}
function ktHTML(tex,display){return katex.renderToString(tex,{throwOnError:false,displayMode:!!display});}

/* ── 定数 ── */
const TIME_LIMIT=60, WARN_SEC=20, DANGER_SEC=10;

/* ── State ── */
let level=1,qIndex=0,correct=0,wrong=0,streak=0,maxStreak=0;
let currentQ=null,answered=false;
let timerVal=TIME_LIMIT,timerInterval=null;
let hintUsed=false;
let missedQuestions=[];
let playerName='',playerClass='',playerNumber='',studentName='';
let logTabState='chart';
let sessionQtypeLog={};

/* ══════════ Lv1 データ ══════════ */
const L1_EASY=[
  [8,2,2,'4\\times2'],[12,2,3,'4\\times3'],[18,3,2,'9\\times2'],
  [20,2,5,'4\\times5'],[24,2,6,'4\\times6'],[27,3,3,'9\\times3'],
  [28,2,7,'4\\times7'],[32,4,2,'16\\times2'],[45,3,5,'9\\times5'],
  [48,4,3,'16\\times3'],[50,5,2,'25\\times2'],[63,3,7,'9\\times7'],
  [75,5,3,'25\\times3'],[80,4,5,'16\\times5'],
];
const L1_MED=[
  [72,6,2,'36\\times2'],[98,7,2,'49\\times2'],[108,6,3,'36\\times3'],
  [125,5,5,'25\\times5'],[147,7,3,'49\\times3'],[162,9,2,'81\\times2'],
  [200,10,2,'100\\times2'],[242,11,2,'121\\times2'],[243,9,3,'81\\times3'],
  [245,7,5,'49\\times5'],[288,12,2,'144\\times2'],[300,10,3,'100\\times3'],
  [507,13,3,'169\\times3'],[338,13,2,'169\\times2'],
];
const L1_FRAC=[
  {tex:'\\dfrac{2}{3}',ansa:6,fracDen:3,hint:'√(2/3) = √2/√3。分母に√3をかけて整数にしよう',steps:['\\sqrt{\\dfrac{2}{3}} = \\dfrac{\\sqrt{2}}{\\sqrt{3}}','\\dfrac{\\sqrt{2}}{\\sqrt{3}} \\times \\dfrac{\\sqrt{3}}{\\sqrt{3}} = \\dfrac{\\sqrt{6}}{3}']},
  {tex:'\\dfrac{3}{5}',ansa:15,fracDen:5,hint:'分母の√5に√5をかけて5にしよう',steps:['\\sqrt{\\dfrac{3}{5}} = \\dfrac{\\sqrt{3}}{\\sqrt{5}}','\\dfrac{\\sqrt{3} \\times \\sqrt{5}}{5} = \\dfrac{\\sqrt{15}}{5}']},
  {tex:'\\dfrac{5}{2}',ansa:10,fracDen:2,hint:'分母の√2に√2をかけて2にしよう',steps:['\\sqrt{\\dfrac{5}{2}} = \\dfrac{\\sqrt{5}}{\\sqrt{2}}','\\dfrac{\\sqrt{5} \\times \\sqrt{2}}{2} = \\dfrac{\\sqrt{10}}{2}']},
  {tex:'\\dfrac{7}{3}',ansa:21,fracDen:3,hint:'分母の√3に√3をかけて3にしよう',steps:['\\sqrt{\\dfrac{7}{3}} = \\dfrac{\\sqrt{7}}{\\sqrt{3}}','\\dfrac{\\sqrt{7} \\times \\sqrt{3}}{3} = \\dfrac{\\sqrt{21}}{3}']},
  {tex:'\\dfrac{5}{7}',ansa:35,fracDen:7,hint:'分母の√7に√7をかけて7にしよう',steps:['\\sqrt{\\dfrac{5}{7}} = \\dfrac{\\sqrt{5}}{\\sqrt{7}}','\\dfrac{\\sqrt{5} \\times \\sqrt{7}}{7} = \\dfrac{\\sqrt{35}}{7}']},
  {tex:'\\dfrac{2}{5}',ansa:10,fracDen:5,hint:'分母の√5に√5をかけて5にしよう',steps:['\\sqrt{\\dfrac{2}{5}} = \\dfrac{\\sqrt{2}}{\\sqrt{5}}','\\dfrac{\\sqrt{2} \\times \\sqrt{5}}{5} = \\dfrac{\\sqrt{10}}{5}']},
  {tex:'\\dfrac{3}{7}',ansa:21,fracDen:7,hint:'分母の√7に√7をかけて7にしよう',steps:['\\sqrt{\\dfrac{3}{7}} = \\dfrac{\\sqrt{3}}{\\sqrt{7}}','\\dfrac{\\sqrt{3} \\times \\sqrt{7}}{7} = \\dfrac{\\sqrt{21}}{7}']},
];
const L1_INT_POOL=[
  {tex:'\\sqrt{5}',ip:2,hint:'2²=4, 3²=9。5はどちらの間にある？',steps:['2^2 = 4 < 5 < 9 = 3^2','\\therefore\\; 2 < \\sqrt{5} < 3']},
  {tex:'\\sqrt{7}',ip:2,hint:'2²=4, 3²=9。7はどちらの間にある？',steps:['2^2 = 4 < 7 < 9 = 3^2','\\therefore\\; 2 < \\sqrt{7} < 3']},
  {tex:'\\sqrt{10}',ip:3,hint:'3²=9, 4²=16。10はどちらの間にある？',steps:['3^2 = 9 < 10 < 16 = 4^2','\\therefore\\; 3 < \\sqrt{10} < 4']},
  {tex:'\\sqrt{15}',ip:3,hint:'3²=9, 4²=16。15はどちらの間にある？',steps:['3^2 = 9 < 15 < 16 = 4^2','\\therefore\\; 3 < \\sqrt{15} < 4']},
  {tex:'\\sqrt{20}',ip:4,hint:'4²=16, 5²=25。20はどちらの間にある？',steps:['4^2 = 16 < 20 < 25 = 5^2','\\therefore\\; 4 < \\sqrt{20} < 5']},
  {tex:'\\sqrt{26}',ip:5,hint:'5²=25, 6²=36。26はどちらの間にある？',steps:['5^2 = 25 < 26 < 36 = 6^2','\\therefore\\; 5 < \\sqrt{26} < 6']},
  {tex:'\\sqrt{35}',ip:5,hint:'5²=25, 6²=36。35はどちらの間にある？',steps:['5^2 = 25 < 35 < 36 = 6^2','\\therefore\\; 5 < \\sqrt{35} < 6']},
  {tex:'\\sqrt{50}',ip:7,hint:'7²=49, 8²=64。50はどちらの間にある？',steps:['7^2 = 49 < 50 < 64 = 8^2','\\therefore\\; 7 < \\sqrt{50} < 8']},
  {tex:'\\sqrt{2}+1',ip:2,hint:'√2≈1.414。1.414+1=？整数部分は？',steps:['\\sqrt{2} \\approx 1.414','\\sqrt{2}+1 \\approx 2.414 \\quad \\therefore\\; \\text{整数部分} = 2']},
  {tex:'\\sqrt{3}+1',ip:2,hint:'√3≈1.732。1.732+1=？整数部分は？',steps:['\\sqrt{3} \\approx 1.732','\\sqrt{3}+1 \\approx 2.732 \\quad \\therefore\\; \\text{整数部分} = 2']},
  {tex:'\\sqrt{5}-1',ip:1,hint:'√5≈2.236。2.236-1=？整数部分は？',steps:['\\sqrt{5} \\approx 2.236','\\sqrt{5}-1 \\approx 1.236 \\quad \\therefore\\; \\text{整数部分} = 1']},
  {tex:'2\\sqrt{3}',ip:3,hint:'2√3=√12。√9=3, √16=4, √12はどちらの間？',steps:['2\\sqrt{3} = \\sqrt{12}','3^2=9 < 12 < 16=4^2 \\quad \\therefore\\; \\text{整数部分} = 3']},
  {tex:'3\\sqrt{2}',ip:4,hint:'3√2=√18。√16=4, √25=5, √18はどちらの間？',steps:['3\\sqrt{2} = \\sqrt{18}','4^2=16 < 18 < 25=5^2 \\quad \\therefore\\; \\text{整数部分} = 4']},
];
const L1_REV=[
  [2,2,8],[2,3,12],[3,2,18],[2,5,20],[2,6,24],[3,3,27],
  [2,7,28],[4,2,32],[3,5,45],[4,3,48],[5,2,50],[3,7,63],
  [5,3,75],[4,5,80],[6,2,72],[7,2,98],[6,3,108],[5,5,125],
  [7,3,147],[9,2,162],[10,2,200],[9,3,243],[7,5,245],
];

function genLevel1(){
  const t=Math.random();
  if(t<0.40){
    const all=[...L1_EASY,...L1_MED];
    const [inside,a,b,steps]=all[Math.floor(Math.random()*all.length)];
    const isEasy=L1_EASY.some(r=>r[0]===inside);
    return{diff:isEasy?1:2,qtype:'簡略化',
      hint:isEasy?`${inside}の中から完全平方数を探そう。${inside}÷4, ÷9... と試してみよう`:`大きな完全平方数を探そう。√${inside}=√(□×${b}) の□は？`,
      displayTex:`\\sqrt{${inside}}`,answerA:a,answerB:b,
      steps:[`\\sqrt{${inside}} = \\sqrt{${steps}}`,`= \\sqrt{${a*a}} \\times \\sqrt{${b}} = ${T(a,b)}`],
      correctTex:T(a,b)};
  }
  if(t<0.65){
    const [a,b,c]=L1_REV[Math.floor(Math.random()*L1_REV.length)];
    return{diff:1,qtype:'逆変換',hint:`${a}√${b} = √(${a}²×${b}) = √?`,
      displayTex:`${a}\\sqrt{${b}}`,ansMode:'single_sqrt',answerA:c,
      steps:[`${a}\\sqrt{${b}} = \\sqrt{${a}^2 \\times ${b}} = \\sqrt{${c}}`],
      correctTex:`\\sqrt{${c}}`};
  }
  if(t<0.80){
    const p=L1_INT_POOL[Math.floor(Math.random()*L1_INT_POOL.length)];
    return{diff:3,qtype:'整数部分',hint:p.hint,
      displayTex:p.tex,ansMode:'single',inputLabel:'整数部分',
      answerA:p.ip,steps:p.steps,correctTex:`${p.ip}`};
  }
  const p=L1_FRAC[Math.floor(Math.random()*L1_FRAC.length)];
  return{diff:3,qtype:'有理化',hint:p.hint,
    displayTex:`\\sqrt{${p.tex}}`,answerA:p.ansa,fracDen:p.fracDen,ansMode:'frac',
    steps:p.steps,correctTex:`\\dfrac{\\sqrt{${p.ansa}}}{${p.fracDen}}`};
}

/* ══════════ Lv2 データ ══════════ */
function T(coeff,base){if(base===1)return`${coeff}`;if(coeff===1)return`\\sqrt{${base}}`;return`${coeff}\\sqrt{${base}}`;}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=rnd(0,i);[arr[i],arr[j]]=[arr[j],arr[i]];}}

function genL2diff1(){
  const roots=[2,3,5,6,7];
  const base=roots[rnd(0,roots.length-1)];
  const coeffs=[rnd(2,6),1,rnd(2,5)];shuffle(coeffs);
  const[a,b,c]=coeffs;
  function termTex(coeff,base){if(coeff>1&&Math.random()<0.5)return`\\sqrt{${coeff*coeff*base}}`;return T(coeff,base);}
  const tA=termTex(a,base),tB=termTex(b,base),tC=termTex(c,base);
  const patterns=[
    {q:`${tA}+${tB}+${tC}`,ans:a+b+c,steps:[`\\text{各項を簡単にすると}：${T(a,base)},\\;${T(b,base)},\\;${T(c,base)}`,`(${a}+${b}+${c})\\sqrt{${base}} = ${T(a+b+c,base)}`]},
    {q:`${tA}+${tB}-${tC}`,ans:a+b-c,steps:[`\\text{各項を簡単にすると}：${T(a,base)},\\;${T(b,base)},\\;${T(c,base)}`,`(${a}+${b}-${c})\\sqrt{${base}} = ${T(a+b-c,base)}`]},
    {q:`${tA}-${tB}+${tC}`,ans:a-b+c,steps:[`\\text{各項を簡単にすると}：${T(a,base)},\\;${T(b,base)},\\;${T(c,base)}`,`(${a}-${b}+${c})\\sqrt{${base}} = ${T(a-b+c,base)}`]},
  ].filter(p=>p.ans>0);
  const p=patterns[rnd(0,patterns.length-1)];
  return{diff:1,qtype:'加減算',hint:`それぞれ √${base} の形に変形してから、係数（前の数）を計算しよう`,
    displayTex:p.q,answerA:p.ans,answerB:base,steps:p.steps,correctTex:T(p.ans,base)};
}

const L2D2_POOL=[

function genLevel2(){
  const r=Math.random();
  if(r<0.33)return genL2diff1();
  if(r<0.66){
    if(Math.random()<0.25){
      const p=L2_EXPR_POOL[rnd(0,L2_EXPR_POOL.length-1)];
      return{diff:2,qtype:'式の値',hint:p.hint,hintMode:'katex',hintTex:p.hintTex,displayTex:p.exprTex,ansMode:'single',inputLabel:'式の値',answerA:p.ans,steps:p.steps,correctTex:String(p.ans)};
    }
    return genL2diff2();
  }
  const r2=Math.random();
  if(r2<0.35){
    const p=L2_EXPR_POOL[rnd(0,L2_EXPR_POOL.length-1)];
    return{diff:3,qtype:'式の値',hint:p.hint,hintMode:'katex',hintTex:p.hintTex,displayTex:p.exprTex,ansMode:'single',inputLabel:'式の値',answerA:p.ans,steps:p.steps,correctTex:String(p.ans)};
  }
  if(r2<0.7){
    const p=L2_CONJ_POOL[rnd(0,L2_CONJ_POOL.length-1)];
    return{diff:3,qtype:'共役有理化',hint:p.hint,displayTex:p.q,ansMode:p.sign==='minus'?'conj_minus':'conj_plus',conjN:p.conjN,conjB:p.conjB,steps:p.steps,correctTex:p.ct};
  }
  return genL2diff3_expand();
}

/* ── Timer ── */
function startTimer(){
  stopTimer();updateTimerUI();
  timerInterval=setInterval(()=>{
    timerVal--;updateTimerUI();
    if(timerVal<=0){stopTimer();timerVal=0;updateTimerUI();onGameTimeout();}
  },1000);
}
function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}}
function updateTimerUI(){
  const el=document.getElementById('timerDisplay');
  const fill=document.getElementById('timerFill');
  const pct=(timerVal/TIME_LIMIT)*100;
  el.textContent=timerVal;
  fill.style.width=pct+'%';
  const cls=timerVal<=DANGER_SEC?'danger':timerVal<=WARN_SEC?'warn':'';
  el.className='timer-display '+cls;
  fill.className='timer-fill '+cls;
}
function addTime(sec){
  timerVal=Math.min(timerVal+sec,TIME_LIMIT);
  updateTimerUI();
}
function showBonusToast(msg){
  const t=document.getElementById('bonusToast');
  t.textContent=msg;t.className='bonus-toast show';
  setTimeout(()=>t.className='bonus-toast hide',1200);
  setTimeout(()=>t.className='bonus-toast',1600);
}
function onGameTimeout(){
  if(!answered){wrong++;streak=0;updateStats();
    document.getElementById('mainCard').classList.add('timeout-flash');
    setTimeout(()=>document.getElementById('mainCard').classList.remove('timeout-flash'),600);}
  setTimeout(()=>showFinish(true),700);
}

/* ── Game flow ── */
function startGame(){
  document.getElementById('startScreen').style.display='none';
  document.getElementById('gameScreen').style.display='block';
  correct=0;wrong=0;streak=0;maxStreak=0;qIndex=0;
  missedQuestions=[];
  timerVal=TIME_LIMIT;
  updateStats();updateStreak();
  showNextQuestion();
  startTimer();
}

/* ★ 無制限出題：毎回新しい問題を生成 */
function showNextQuestion(){
  const q = level===1 ? genLevel1() : genLevel2();
  showQuestion(q);
}

function showQuestion(q){
  currentQ=q;answered=false;hintUsed=false;
  const hintEl=document.getElementById('questionHint');
  if(q.hintMode==='katex'&&q.hintTex){hintEl.innerHTML='';kt(q.hintTex,hintEl,false);}
  else{hintEl.textContent=q.hint||'';}
  const expr=document.getElementById('questionExpr');
  expr.innerHTML='';kt(q.displayTex,expr,true);
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  document.getElementById('explanation').className='explanation';
  document.getElementById('nextBtn').className='next-btn';
  document.getElementById('checkBtn').style.display='inline-block';
  const hintBtn=document.getElementById('hintBtn');
  hintBtn.disabled=false;hintBtn.style.display='inline-block';
  document.getElementById('hintPopup').className='hint-popup';
  document.getElementById('hintPopup').innerHTML='';
  const db=document.getElementById('diffBadge');
  db.textContent=q.diff===1?'基本':q.diff===2?'応用':'発展';
  db.className=`diff-badge diff-${q.diff}`;
  const qb=document.getElementById('qtypeBadge');
  if(q.qtype){qb.textContent=q.qtype;qb.style.display='inline-block';}else{qb.style.display='none';}
  buildAnswerUI(q);
  // 問題数カウント表示
  qIndex++;
  document.getElementById('progressLabel').textContent=`${qIndex} 問目`;
  document.getElementById('progressFill').style.width='0%';
}

function showHint(){
  if(hintUsed||answered)return;
  hintUsed=true;
  const btn=document.getElementById('hintBtn');
  btn.disabled=true;btn.textContent='💡 ヒント使用済み（-3秒）';
  timerVal=Math.max(1,timerVal-3);updateTimerUI();
  const popup=document.getElementById('hintPopup');
  popup.innerHTML='<strong>💡 ヒント：</strong> '+currentQ.hint;
  popup.className='hint-popup visible';
  if(currentQ.ansMode==='frac'){
    popup.innerHTML+='<br><small style="color:#a16207;">📌 答えの形：√(□)/'+currentQ.fracDen+'</small>';
  }
}

function nextQuestion(){
  const nb=document.getElementById('nkEnterBtn');
  if(nb){nb.textContent='答え合わせ ✓';nb.onclick=()=>nkEnter();}
  showNextQuestion();
}

function updateStats(){
  const t=correct+wrong;
  document.getElementById('scoreCorrect').textContent=correct;
  document.getElementById('scoreTotal').textContent=t;
  document.getElementById('statCorrect').textContent=correct;
  document.getElementById('statWrong').textContent=wrong;
  document.getElementById('statRate').textContent=t>0?Math.round(correct/t*100)+'%':'—';
  document.getElementById('statStreak').textContent=maxStreak;
}
function updateStreak(){
  document.getElementById('streakNum').textContent=streak;
  document.getElementById('streakBadge').className=streak>=3?'streak-badge visible':'streak-badge';
}

/* ── Numpad ── */
let nkFocusId=null;
function nkFocus(id){
  if(nkFocusId){const prev=document.getElementById(nkFocusId);if(prev)prev.classList.remove('focused');}
  nkFocusId=id;
  const el=document.getElementById(id);
  if(el){el.classList.add('focused');el.blur();}
  document.getElementById('numpadWrap').style.display='block';
}
function nkPress(n){
  if(!nkFocusId||answered)return;
  const el=document.getElementById(nkFocusId);
  if(!el)return;
  if(el.value.length>=3)return;
  el.value=(el.value==='0'?'':el.value)+n;
}
function nkBS(){
  if(!nkFocusId||answered)return;
  const el=document.getElementById(nkFocusId);
  if(!el)return;
  el.value=el.value.slice(0,-1);
}
function nkEnter(){
  if(answered)return;
  const all=['inpA','inpExpB','inpC','inpB'];
  const visible=all.filter(id=>!!document.getElementById(id));
  const idx=visible.indexOf(nkFocusId);
  if(idx>=0&&idx<visible.length-1){nkFocus(visible[idx+1]);}
  else{checkAnswer();}
}
function initNkFocus(ids){setTimeout(()=>{if(ids.length>0)nkFocus(ids[0]);},40);}

/* ── Check answer ── */
function checkAnswer(){
  if(answered)return;
  const q=currentQ;
  let isCorrect=false;
  if(q.ansMode==='single_sqrt'||q.ansMode==='single'){
    const a=parseInt(document.getElementById('inpA').value);
    if(isNaN(a)){inputError();return;}
    isCorrect=(a===q.answerA);markInputs(['inpA'],isCorrect);
  }else if(q.ansMode==='conj_minus'||q.ansMode==='conj_plus'){
    const a=parseInt(document.getElementById('inpA').value);
    const b=parseInt(document.getElementById('inpB').value);
    if(isNaN(a)||isNaN(b)){inputError();return;}
    isCorrect=(a===q.conjN&&b===q.conjB);markInputs(['inpA','inpB'],isCorrect);
  }else if(q.ansMode==='expand'||q.ansMode==='expand_minus'){
    const a=parseInt(document.getElementById('inpA').value);
    const expB=parseInt(document.getElementById('inpExpB').value);
    const b=parseInt(document.getElementById('inpB').value);
    if(isNaN(a)||isNaN(expB)||isNaN(b)){inputError();return;}
    isCorrect=(a===q.expandA&&expB===q.expandB&&b===q.expandN);markInputs(['inpA','inpExpB','inpB'],isCorrect);
  }else if(q.ansMode==='two_roots'){
    const a=parseInt(document.getElementById('inpA').value);
    const n=parseInt(document.getElementById('inpExpB').value);
    const b=parseInt(document.getElementById('inpC').value);
    const m=parseInt(document.getElementById('inpB').value);
    if(isNaN(a)||isNaN(n)||isNaN(b)||isNaN(m)){inputError();return;}
    isCorrect=(a===q.r1c&&n===q.r1n&&b===q.r2c&&m===q.r2n);markInputs(['inpA','inpExpB','inpC','inpB'],isCorrect);
  }else if(q.ansMode==='frac'){
    const a=parseInt(document.getElementById('inpA').value);
    if(isNaN(a)){inputError();return;}
    isCorrect=(a===q.answerA);markInputs(['inpA'],isCorrect);
  }else{
    const a=parseInt(document.getElementById('inpA').value);
    const b=parseInt(document.getElementById('inpB').value);
    if(isNaN(a)||isNaN(b)){inputError();return;}
    isCorrect=(a===q.answerA&&b===q.answerB);markInputs(['inpA','inpB'],isCorrect);
  }

  answered=true;
  document.getElementById('hintBtn').style.display='none';

  if(isCorrect){
    correct++;streak++;
    if(streak>maxStreak)maxStreak=streak;
    timerVal=Math.min(timerVal+1,TIME_LIMIT);
    updateTimerUI();
    if(streak>=3)showBonusToast(`🔥 ${streak}連続！ +1秒`);
    const fb=document.getElementById('feedback');
    fb.textContent=streak>=3?`正解！🎉 ${streak}連続！`:'正解！🎉';
    fb.className='feedback correct celebrate';
  }else{
    wrong++;streak=0;
    missedQuestions.push({...q});
    const fb=document.getElementById('feedback');
    fb.innerHTML='不正解… 答えは '+ktHTML(q.correctTex,false);
    fb.className='feedback wrong';
  }
  updateStreak();updateStats();

  const expl=document.getElementById('explanation');
  let html='<strong>解説</strong>';
  if(q.steps&&q.steps.length>0){
    html+='<div class="expl-steps">';
    q.steps.forEach((s,i)=>{
      html+=`<div class="expl-step"><div class="step-num">${i+1}</div><div class="step-body">${ktHTML(s,false)}</div></div>`;
    });
    html+='</div>';
  }
  expl.innerHTML=html;expl.className='explanation visible';

  document.getElementById('checkBtn').style.display='none';
  document.getElementById('nextBtn').className='next-btn visible';
  const nb=document.getElementById('nkEnterBtn');
  if(nb){nb.textContent='次の問題 →';nb.onclick=()=>nextQuestion();}

  logQuestionResult(q.qtype||'その他',isCorrect);
}

function inputError(){
  document.getElementById('feedback').textContent='すべての欄を入力してください。';
  document.getElementById('feedback').className='feedback wrong';
}
function markInputs(ids,ok){
  ids.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.add(ok?'correct':'wrong');});
}

/* ── 間違えた問題の解説 ── */
function renderMissedReview(){
  const old=document.getElementById('missedReview');if(old)old.remove();
  if(!missedQuestions||missedQuestions.length===0)return;
  const wrap=document.createElement('div');
  wrap.id='missedReview';wrap.style.cssText='width:100%;max-width:720px;margin-top:14px;';
  const hdr=document.createElement('button');
  hdr.className='missed-toggle';
  hdr.innerHTML=`<span>❌ 間違えた問題の解説（${missedQuestions.length}問）</span><span class="toggle-arrow">▼</span>`;
  hdr.onclick=()=>{
    const body=document.getElementById('missedBody');
    const arrow=hdr.querySelector('.toggle-arrow');
    const open=body.style.display==='block';
    body.style.display=open?'none':'block';
    arrow.textContent=open?'▼':'▲';
  };
  const body=document.createElement('div');body.id='missedBody';body.style.display='none';
  missedQuestions.forEach((q,i)=>{
    const card=document.createElement('div');card.className='missed-card';
    const badge=document.createElement('div');badge.className='missed-badge';
    badge.innerHTML=`<span class="missed-num">問題 ${i+1}</span>`+(q.qtype?`<span class="missed-qtype">${q.qtype}</span>`:'')+`<span class="missed-diff diff-${q.diff}">${q.diff===1?'基本':q.diff===2?'応用':'発展'}</span>`;
    const qExpr=document.createElement('div');qExpr.className='missed-expr';
    try{katex.render(q.displayTex,qExpr,{throwOnError:false,displayMode:true});}catch(e){qExpr.textContent=q.displayTex;}
    const ansDiv=document.createElement('div');ansDiv.className='missed-answer';
    ansDiv.innerHTML='正解：'+ktHTML(q.correctTex,false);
    const stepsDiv=document.createElement('div');stepsDiv.className='missed-steps';
    if(q.steps&&q.steps.length>0){
      stepsDiv.innerHTML='<div class="missed-steps-title">解説ステップ</div>';
      q.steps.forEach((s,si)=>{
        const step=document.createElement('div');step.className='expl-step';
        step.innerHTML=`<div class="step-num">${si+1}</div><div class="step-body">${ktHTML(s,false)}</div>`;
        stepsDiv.appendChild(step);
      });
    }
    card.appendChild(badge);card.appendChild(qExpr);
    if(q.hint){const hd=document.createElement('div');hd.innerHTML=`<div class="missed-hint">💡 ${q.hint}</div>`;card.appendChild(hd);}
    card.appendChild(ansDiv);card.appendChild(stepsDiv);body.appendChild(card);
  });
  wrap.appendChild(hdr);wrap.appendChild(body);
  const stats=document.querySelector('.stats-row');
  if(stats)stats.parentNode.insertBefore(wrap,stats);else document.body.appendChild(wrap);
}

  examples.forEach(([cls,label,qTex,ansTex])=>{
    const card=document.createElement('div');card.className=`qtype-item ${cls}`;
    const lbl=document.createElement('strong');lbl.textContent=label;card.appendChild(lbl);
    const exprWrap=document.createElement('div');exprWrap.className='ex-expr';
    try{katex.render(qTex,exprWrap,{throwOnError:false,displayMode:false});}catch(e){exprWrap.textContent=qTex;}
    card.appendChild(exprWrap);
    const ansWrap=document.createElement('div');ansWrap.className='ex-ans';
    try{ansWrap.innerHTML=katex.renderToString(ansTex,{throwOnError:false,displayMode:false});}catch(e){ansWrap.textContent=ansTex;}
    card.appendChild(ansWrap);el.appendChild(card);
  });
}

/* ══════════ ログ / localStorage ══════════ */
const LOG_PREFIX='sqrt_log_';
const QTYPE_KEY_PREFIX='sqrt_qtype_';

function logQuestionResult(qtype,isCorrect){
  if(!sessionQtypeLog[qtype])sessionQtypeLog[qtype]={c:0,t:0};
  sessionQtypeLog[qtype].t++;
  if(isCorrect)sessionQtypeLog[qtype].c++;
}
function saveQtypeLog(){
  if(!playerName)return;
  const key=QTYPE_KEY_PREFIX+playerName;
  let stored={};try{stored=JSON.parse(localStorage.getItem(key)||'{}');}catch(e){}
  Object.entries(sessionQtypeLog).forEach(([qt,val])=>{
    if(!stored[qt])stored[qt]={c:0,t:0};
    stored[qt].c+=val.c;stored[qt].t+=val.t;
  });
  localStorage.setItem(key,JSON.stringify(stored));
  sessionQtypeLog={};
}
function saveLog(correct,total,usedTime,isTimeout){
  saveQtypeLog();if(!playerName)return;
  const rate=Math.round(correct/total*100);
  const rank=rate===100?'S':rate>=80?'A':rate>=60?'B':'C';
  const now=new Date();
  const dateStr=`${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const entry={date:dateStr,level,correct,total,rate,rank,usedTime,timeout:isTimeout,maxStreak};
  const key=LOG_PREFIX+playerName;
  let logs=[];try{logs=JSON.parse(localStorage.getItem(key)||'[]');}catch(e){}
  logs.push(entry);if(logs.length>100)logs=logs.slice(-100);
  localStorage.setItem(key,JSON.stringify(logs));
}
function getLogs(){
  if(!playerName)return[];
  try{return JSON.parse(localStorage.getItem(LOG_PREFIX+playerName)||'[]');}catch(e){return[];}
}
function getQtypeLogs(){
  if(!playerName)return{};
  try{return JSON.parse(localStorage.getItem(QTYPE_KEY_PREFIX+playerName)||'{}');}catch(e){return{};}
}
function clearLog(){
  if(!playerName)return;
  if(!confirm('記録をすべて削除しますか？'))return;
  localStorage.removeItem(LOG_PREFIX+playerName);
  localStorage.removeItem(QTYPE_KEY_PREFIX+playerName);
  renderLogScreen();
}

/* ── クラス選択 ── */
function initClassSelect(){
  const sel=document.getElementById('classSelect');if(!sel)return;
  sel.innerHTML='<option value="">▼ クラスを選択</option>';
  CLASS_LIST.forEach(c=>{
    const opt=document.createElement('option');
    opt.value=c;opt.textContent=c;sel.appendChild(opt);
  });
}

/* ★ 毎回入力：saveName で入力値を記録してスタート画面へ */
function saveName(){
  const cls=document.getElementById('classSelect').value;
  if(!cls){alert('クラスを選んでください');return;}
  const num=document.getElementById('numberInput').value.trim();
  if(!num||isNaN(num)||Number(num)<1){alert('出席番号を入力してください');return;}
  const sname=document.getElementById('nameInput').value.trim();
  if(!sname){alert('名前を入力してください');return;}
  playerNumber=num;
  studentName=sname;
  playerName=cls;
  playerClass=cls;
  // 入力欄はクリア（次回のために空にする）
  document.getElementById('classSelect').value='';
  document.getElementById('numberInput').value='';
  document.getElementById('nameInput').value='';
  document.getElementById('nameScreen').style.display='none';
  // プレイヤー情報をスタート画面に表示
  const pi=document.getElementById('playerInfo');
  if(pi) pi.textContent=`${cls}クラス ${num}番 ${sname}`;
  document.getElementById('startScreen').style.display='block';
  updateLogBtn();renderQtypeList();
}

function updateLogBtn(){
  const btn=document.getElementById('logBtn');
  if(btn)btn.textContent=(playerName&&playerNumber&&studentName)?`📊 ${playerName}クラス ${playerNumber}番`:'📊 記録';
}

/* ── 成績送信 ── */
function sendResult(btn){
  if(!GAS_URL||GAS_URL.includes('ここに')){alert('GAS URLが設定されていません。');return;}
  const logs=getLogs();if(logs.length===0){alert('送信する記録がありません');return;}
  const latest=logs[logs.length-1];
  const qtypeData=getQtypeLogs();
  const weakness=Object.entries(qtypeData).map(([type,v])=>({type,miss:v.t-v.c})).filter(w=>w.miss>0).sort((a,b)=>b.miss-a.miss).slice(0,3).map(w=>`${w.type}(${w.miss}問)`).join(',');
  const params=new URLSearchParams({
    className:playerClass,number:playerNumber,studentName:studentName,
    level:latest.level||'',correct:latest.correct??'',total:latest.total??qIndex,
    rate:latest.rate??'',usedTime:latest.usedTime??'',rank:latest.rank||'',
    maxStreak:latest.maxStreak||0,timeout:latest.timeout?'true':'false',weakness:weakness,
  });
  const url=GAS_URL+'?'+params.toString();
  const statusEl=document.getElementById('sendStatus');
  btn.disabled=true;
  if(statusEl){statusEl.textContent='送信中…';statusEl.className='send-status wait';}
  fetch(url).then(r=>r.text()).then(()=>{
    if(statusEl){statusEl.textContent='✅ 送信しました！';statusEl.className='send-status ok';}
    btn.textContent='✅ 送信済み';
  }).catch(()=>{
    const img=new Image();img.src=url;
    if(statusEl){statusEl.textContent='✅ 送信しました！';statusEl.className='send-status ok';}
    btn.textContent='✅ 送信済み';
  });
}

/* ── ログ画面 ── */
function openLogScreen(){
  ['startScreen','gameScreen','nameScreen'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('logScreen').style.display='block';
  document.getElementById('numpadWrap').style.display='none';
  renderLogScreen();
}
function closeLogScreen(){
  document.getElementById('logScreen').style.display='none';
  document.getElementById('nameScreen').style.display='block';
}
function switchLogTab(tab){
  logTabState=tab;
  document.querySelectorAll('.log-tab-btn').forEach((b,i)=>{
    b.classList.toggle('active',(i===0&&tab==='chart')||(i===1&&tab==='table')||(i===2&&tab==='weakness'));
  });
  document.getElementById('logChartArea').style.display=tab==='chart'?'block':'none';
  document.getElementById('logTableArea').style.display=tab==='table'?'block':'none';
  document.getElementById('logWeaknessArea').style.display=tab==='weakness'?'block':'none';
  if(tab==='chart')drawChart();
  if(tab==='weakness')renderWeakness();
}
function renderLogScreen(){
  const logs=getLogs();
  document.getElementById('logTitle').textContent=playerName?`📊 ${playerName}クラスの学習記録`:'📊 学習記録';
  const noMsg=document.getElementById('noLogMsg');
  if(logs.length===0){
    noMsg.style.display='block';
    ['logChartArea','logTableArea','logWeaknessArea'].forEach(id=>document.getElementById(id).style.display='none');
    document.getElementById('logSummary').innerHTML='';return;
  }
  noMsg.style.display='none';
  const totalPlays=logs.length;
  const avgRate=Math.round(logs.reduce((s,l)=>s+l.rate,0)/logs.length);
  const rankCounts={S:0,A:0,B:0,C:0};logs.forEach(l=>rankCounts[l.rank]=(rankCounts[l.rank]||0)+1);
  const bestRank=['S','A','B','C'].find(r=>rankCounts[r]>0)||'C';
  document.getElementById('logSummary').innerHTML=`
    <div class="summary-card"><div class="summary-val">${totalPlays}</div><div class="summary-name">総プレイ回数</div></div>
    <div class="summary-card"><div class="summary-val">${avgRate}%</div><div class="summary-name">平均正答率</div></div>
    <div class="summary-card"><div class="summary-val rank-cell ${bestRank}" style="font-size:20px;">${bestRank}</div><div class="summary-name">最高ランク</div></div>`;
  if(logTabState==='chart'){document.getElementById('logChartArea').style.display='block';drawChart();}
  else if(logTabState==='table'){document.getElementById('logTableArea').style.display='block';buildTable(logs);}
  else if(logTabState==='weakness'){document.getElementById('logWeaknessArea').style.display='block';renderWeakness();}
}

function drawChart(){
  const logs=getLogs();const canvas=document.getElementById('logCanvas');if(!canvas)return;
  const ctx=canvas.getContext('2d');const dpr=window.devicePixelRatio||1;
  const W=canvas.offsetWidth||560;const H=220;
  canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.height=H+'px';
  ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
  const recent=logs.slice(-15);const n=recent.length;if(n===0)return;
  const PAD={top:24,right:16,bottom:50,left:36};
  const cW=W-PAD.left-PAD.right,cH=H-PAD.top-PAD.bottom;
  ctx.fillStyle='#f8faff';if(ctx.roundRect)ctx.roundRect(0,0,W,H,12);else ctx.rect(0,0,W,H);ctx.fill();
  [0,25,50,75,100].forEach(v=>{
    const y=PAD.top+cH*(1-v/100);
    ctx.strokeStyle='#e0e6f8';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(PAD.left,y);ctx.lineTo(PAD.left+cW,y);ctx.stroke();
    ctx.fillStyle='#9099c0';ctx.font='10px sans-serif';ctx.textAlign='right';ctx.fillText(v+'%',PAD.left-4,y+3.5);
  });
  const barW=Math.max(8,Math.min(26,cW/n*0.55));const gap=cW/n;
  const rankColors={S:'#f59e0b',A:'#3a5bff',B:'#16a34a',C:'#9ca3af'};
  recent.forEach((entry,i)=>{
    const x=PAD.left+gap*i+gap/2;const barH=(entry.rate/100)*cH;const y=PAD.top+cH-barH;
    const col=rankColors[entry.rank]||'#3a5bff';
    ctx.fillStyle=col+'33';if(ctx.roundRect)ctx.roundRect(x-barW/2,y,barW,barH,[4,4,0,0]);else ctx.rect(x-barW/2,y,barW,barH);ctx.fill();
    ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x-barW/2,y,barW,barH,[4,4,0,0]);else ctx.rect(x-barW/2,y,barW,barH);ctx.stroke();
    ctx.fillStyle=col;ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(entry.rank,x,y-4);
    ctx.fillStyle='#9099c0';ctx.font='9px sans-serif';
    const parts=entry.date.split(' ');ctx.fillText(parts[0],x,PAD.top+cH+13);ctx.fillText(parts[1]||'',x,PAD.top+cH+24);
    ctx.fillStyle='#b0b8d8';ctx.font='8px sans-serif';ctx.fillText('Lv'+entry.level,x,PAD.top+cH+36);
  });
  ctx.strokeStyle='#8b5cf6';ctx.lineWidth=2.5;ctx.setLineDash([4,3]);ctx.beginPath();
  recent.forEach((entry,i)=>{const x=PAD.left+gap*i+gap/2;const y=PAD.top+cH*(1-entry.rate/100);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.stroke();ctx.setLineDash([]);
  recent.forEach((entry,i)=>{
    const x=PAD.left+gap*i+gap/2;const y=PAD.top+cH*(1-entry.rate/100);
    ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();ctx.strokeStyle='#8b5cf6';ctx.lineWidth=2;ctx.stroke();
  });
}
function buildTable(logs){
  const t=document.getElementById('logTable');const rev=[...logs].reverse();
  t.innerHTML=`<thead><tr><th>日時</th><th>Lv</th><th>正解</th><th>問題数</th><th>率</th><th>ランク</th></tr></thead>
  <tbody>${rev.map(e=>`<tr><td>${e.date}</td><td>${e.level}</td><td>${e.correct}</td><td>${e.total}</td><td>${e.rate}%</td><td class="rank-cell ${e.rank}">${e.rank}</td></tr>`).join('')}</tbody>`;
}
function renderWeakness(){
  const data=getQtypeLogs();const area=document.getElementById('logWeaknessArea');
  const entries=Object.entries(data);
  if(entries.length===0){area.innerHTML='<div class="no-log">まだデータがありません。</div>';return;}
  entries.sort((a,b)=>(a[1].c/a[1].t)-(b[1].c/b[1].t));
  let html='<div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">問題タイプ別の正答率（低い順）</div><div class="weakness-grid">';
  entries.forEach(([qt,val])=>{
    const rate=Math.round(val.c/val.t*100);const barCls=rate>=80?'good':rate>=50?'mid':'bad';
    html+=`<div class="wk-card"><div class="wk-label">${qt}${rate<50?' ⚠️':''}</div><div class="wk-bar-wrap"><div class="wk-bar ${barCls}" style="width:${rate}%"></div></div><div class="wk-rate" style="color:${rate<50?'var(--wrong)':rate<80?'var(--warning)':'var(--correct)'}">${rate}% <span style="font-size:10px;font-weight:400;color:var(--text-muted)">(${val.c}/${val.t}問)</span></div></div>`;
  });
  html+='</div>';
  const mastered=entries.filter(([,v])=>v.t>=5&&v.c/v.t>=0.8).map(([qt])=>qt);
  const struggling=entries.filter(([,v])=>v.t>=3&&v.c/v.t<0.5).map(([qt])=>qt);
  if(mastered.length>0){html+=`<div style="margin-top:10px;font-size:11px;font-weight:700;color:var(--correct);">✅ 習得済み</div><div class="mastery-row">`;mastered.forEach(qt=>html+=`<span class="mastery-badge gold">⭐ ${qt}</span>`);html+='</div>';}
  if(struggling.length>0){html+=`<div style="margin-top:8px;font-size:11px;font-weight:700;color:var(--wrong);">❗ 重点復習</div><div class="mastery-row">`;struggling.forEach(qt=>html+=`<span class="mastery-badge none">📌 ${qt}</span>`);html+='</div>';}
  area.innerHTML=html;
}

/* ── 初期化 ── */
(function init(){
  initClassSelect();
  // ★常に名前入力画面からスタート
  document.getElementById('nameScreen').style.display='block';
  document.getElementById('startScreen').style.display='none';
})();
</script>
